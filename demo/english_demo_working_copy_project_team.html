.step-audience { margin-top: 42px; color: var(--acc); }

.workflow-card p { margin: 0; color: var(--mut); font-size: 14px; }
.workflow-card.featured p { color: #c8d7d8; }
.workflow-card .card-link { margin-top: auto; padding-top: 28px; color: var(--teal); }
.workflow-card.featured .card-link { color: #ff9b85; }

.evidence-section { padding-bottom: 108px; }
.evidence-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.evidence-card { min-height: 390px; }
.evidence-label { color: var(--acc-deep); }
.evidence-value { margin: 40px 0 10px; color: var(--teal); font-size: clamp(3rem, 7vw, 5rem); line-height: .95; letter-spacing: -.055em; font-weight: 750; }
.evidence-card h3 { max-width: 420px; margin: 0 0 14px; font-size: 1.55rem; }
.evidence-card p { margin: 0; color: var(--mut); }
.evidence-card .card-link { margin-top: auto; padding-top: 28px; }
.evidence-card.dark { color: white; border-color: var(--teal); background: var(--teal); }
.evidence-card.dark:hover { color: white; }
.evidence-card.dark .evidence-label, .evidence-card.dark .card-link { color: #ffc2b5; }
.evidence-card.dark .evidence-value { color: white; }
.evidence-card.dark p { color: #d5e8e4; }

.data-note { max-width: 900px; margin: 0 auto; padding: 70px 9%; border-radius: 26px; text-align: center; color: white; background: var(--ink); box-shadow: var(--shadow); }
.data-note .eyebrow { color: #ff9b85; }
.data-note h2 + p { max-width: 680px; margin: 24px auto 0; color: #bfd0d1; }
.data-note .dataset-link { width: fit-content; margin: 28px auto 0; color: white; border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.08); box-shadow: none; }
.data-note .dataset-link:hover { color: white; border-color: white; background: rgba(255,255,255,.14); }
.data-note .data-fineprint { max-width: 650px; margin: 18px auto 0; color: #91aaac; font-size: 12px; }
.site-footer {
  display: grid;
  grid-template-columns: minmax(320px, 1fr) auto;
  gap: 20px 42px;
  align-items: center;
  margin-top: 86px;
  padding: 28px 30px;
  border: 1px solid var(--line);
  border-radius: 20px;
  color: var(--mut);
  background: rgba(255,255,255,.72);
  font-size: 12px;
}

.site-footer a { font-weight: 750; text-decoration: none; }
.funding-mark { display: flex; align-items: center; gap: 14px; }
.funding-mark > div { display: grid; gap: 2px; }
.funding-mark strong { color: var(--ink); font-size: 13px; }
.funding-mark span { font-size: 11px; }
.eu-logo { width: 66px; height: 44px; flex: 0 0 auto; box-shadow: 0 2px 8px rgba(0,51,153,.16); }
.eu-logo rect { fill: var(--eu-blue); }
.eu-logo g { fill: var(--eu-yellow); }
.footer-links { display: flex; justify-content: flex-end; gap: 18px; }
.footer-disclaimer, .footer-privacy { margin: 0; line-height: 1.5; }
.footer-disclaimer { max-width: 740px; }
.footer-privacy { text-align: right; }

/* Start and passphrase screens */
.loader-page { max-width: 1180px; }
.loader-page .project-context { margin-bottom: 28px; }
.loader-page .loader {
  max-width: 940px;
  margin: 0 auto 64px;
  padding: clamp(30px, 6vw, 60px);
  border: 1px solid var(--line);
  border-radius: 28px;
  background: rgba(255,255,255,.82);
  box-shadow: var(--shadow);
}

.loader-page .loader h1 {
  max-width: 760px;
  margin: 0 0 18px;
  font-size: clamp(2.45rem, 6vw, 4.6rem);
  line-height: 1.02;
  letter-spacing: -.05em;
}

.loader-page .loader .eyebrow { margin-bottom: 14px; }
.loader-page .loader > .lede { max-width: 740px; margin-bottom: 24px; color: var(--ink-soft); font-size: 17px; line-height: 1.6; }
.dropzone {
  margin: 30px 0 34px;
  padding: clamp(30px, 5vw, 48px) 24px;
  border: 2px dashed rgba(29,100,128,.48);
  border-radius: 20px;
  background: var(--teal-soft);
  transition: border-color .18s ease, background .18s ease, transform .18s ease;
}
.dropzone:hover, .dropzone.over { border-color: var(--teal); background: #d9e9ef; transform: translateY(-1px); }
.filebtn { min-height: 54px; padding: 14px 22px; border: 0; background: var(--teal); box-shadow: 0 10px 28px rgba(29,100,128,.2); }
.filebtn:hover { background: #164e64; }
.drophint { margin-top: 14px; }
.loader-steps { grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 30px 0; }
.loader-steps li {
  display: block;
  min-width: 0;
  padding: 20px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--bg);
}
.loader-steps li b {
  width: 34px;
  height: 34px;
  margin-bottom: 14px;
  border: 0;
  color: white;
  background: var(--ink);
  font-size: 15px;
}
.loader-steps li strong { display: block; line-height: 1.35; }
.loader-steps p { margin-top: 8px; font-size: 12px; line-height: 1.55; }
.loader .privacy { margin-bottom: 0; padding: 14px 16px; border: 0; border-radius: 12px; background: var(--card); }
.passform { padding: 20px; border-radius: 16px; background: var(--teal-soft); }
.passform label:first-child { display: grid; gap: 6px; color: var(--ink); font-size: 13px; font-weight: 750; }

/* Ranked output and review screens */
.ranked-page, .review-page { max-width: 1180px; }
.ranked-page .site-header { margin-bottom: 24px; }
.rank-hero {
  position: relative;
  overflow: hidden;
  display: grid;
  grid-template-columns: minmax(0, 1.45fr) minmax(280px, .65fr);
  gap: 46px;
  align-items: end;
  padding: clamp(34px, 6vw, 70px);
  border-radius: 30px;
  color: white;
  background:
    radial-gradient(circle at 90% 15%, rgba(255,255,255,.16) 0 2px, transparent 3px) 0 0 / 21px 21px,
    linear-gradient(125deg, #102b30, #174d4c);
  box-shadow: var(--shadow);
}

.rank-hero .eyebrow { color: #ff9b85; }
.rank-hero h1 { max-width: 700px; font-size: clamp(2.8rem, 6vw, 5rem); }
.rank-hero .hero-lede { color: #d2e0df; }
.rank-hero .button { box-shadow: none; }
.rank-hero .button.secondary { color: white; border: 1px solid rgba(255,255,255,.28); background: rgba(255,255,255,.08); }
.rank-hero .button.secondary:hover { border-color: white; background: rgba(255,255,255,.14); }
.rank-metrics { display: grid; gap: 10px; }
.rank-metric { display: grid; grid-template-columns: 72px 1fr; gap: 14px; align-items: baseline; padding: 16px 0; border-bottom: 1px solid rgba(255,255,255,.2); }
.rank-metric:last-child { border-bottom: 0; }
.rank-metric strong { font-size: 2.1rem; line-height: 1; letter-spacing: -.04em; }
.rank-metric span { color: #c7d9d7; font-size: 13px; line-height: 1.35; }

.dataset-strip {
  display: grid;
  grid-template-columns: minmax(0, 1.35fr) minmax(260px, .65fr);
  gap: 42px;
  align-items: center;
  margin: 42px 0 22px;
  padding: 30px 34px;
  border: 1px solid var(--line);
  border-left: 5px solid var(--acc);
  border-radius: 4px 20px 20px 4px;
  background: rgba(255,255,255,.72);
}

.dataset-strip .eyebrow { margin-bottom: 10px; }
.dataset-strip h2 { margin: 0 0 12px; font-size: clamp(1.55rem, 2.5vw, 2.15rem); }
.dataset-strip > div > p:last-child { margin: 0; color: var(--mut); font-size: 14px; }
.dataset-summary { display: grid; gap: 9px; padding: 18px; border-radius: 14px; background: var(--card); }
.dataset-summary > span { color: var(--ink-soft); font-size: 12px; }
.dataset-summary > span strong { display: inline-block; min-width: 42px; color: var(--ink); font-size: 1.3rem; line-height: 1; }
.dataset-summary a { margin-top: 6px; font-size: 13px; font-weight: 800; text-decoration: none; }
.dataset-summary small { color: var(--mut); font-size: 10px; }

.rank-logic {
  display: grid;
  grid-template-columns: minmax(260px, .8fr) minmax(470px, 1.2fr);
  gap: 26px 52px;
  align-items: end;
  margin: 52px 0 24px;
  padding: 34px;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: rgba(255,255,255,.7);
}

.rank-logic .eyebrow { margin-bottom: 12px; }
.rank-logic h2 { margin: 0 0 14px; font-size: clamp(1.7rem, 3vw, 2.4rem); }
.rank-logic > div > p:last-child { margin: 0; color: var(--mut); font-size: 14px; }
.output-routes { display: grid; grid-template-columns: minmax(360px, 1.35fr) minmax(190px, .65fr); gap: 10px; }
.rank-route, .category-route { padding: 14px; border: 1px solid var(--line); border-radius: 16px; background: var(--paper); }
.route-label { display: block; margin-bottom: 10px; color: var(--mut); font-size: 10px; font-weight: 850; letter-spacing: .1em; text-transform: uppercase; }
.tier-key { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0; padding: 0; list-style: none; }
.tier-key li { min-height: 112px; padding: 14px; border-radius: 12px; background: var(--card); }
.tier-key li.tier-top { color: white; background: var(--teal); }
.tier-key span { display: block; color: var(--mut); font-size: 10px; font-weight: 850; letter-spacing: .1em; text-transform: uppercase; }
.tier-key .tier-top span, .tier-key .tier-top p { color: #d5e7e3; }
.tier-key strong { display: block; margin: 13px 0 7px; font-size: 2rem; line-height: 1; }
.tier-key p { margin: 0; color: var(--mut); font-size: 11px; line-height: 1.35; }
.category-route { display: flex; flex-direction: column; color: var(--ink); text-decoration: none; background: var(--teal-soft); }
.category-route:hover { color: var(--ink); border-color: var(--teal); }
.category-route > strong { font-size: 1.15rem; }
.category-route > p { margin: 6px 0 12px; color: var(--mut); font-size: 11px; line-height: 1.4; }
.category-preview { display: flex; gap: 5px; flex-wrap: wrap; }
.category-preview span { padding: 3px 7px; border-radius: 999px; color: var(--teal); background: rgba(255,255,255,.65); font-size: 10px; }
.category-preview b { margin-left: 2px; }
.route-link { margin-top: auto; padding-top: 12px; color: var(--teal); font-size: 11px; font-weight: 800; }
.rank-method-link { grid-column: 1 / -1; font-size: 13px; font-weight: 750; text-decoration: none; }

.stages { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; margin: 20px 0 48px; padding: 6px; border: 1px solid var(--line); border-radius: 17px; background: rgba(255,255,255,.66); }
.stages .st { position: relative; display: grid; grid-template-columns: 38px 1fr; align-items: center; min-height: 64px; padding: 10px 14px; border: 0; border-radius: 12px; color: var(--mut); background: transparent; font-size: 13px; line-height: 1.25; }
.stages .st b { grid-row: 1 / span 2; margin: 0; color: var(--line-strong); font-size: 1.25rem; }
.stages .st small { display: block; font-size: 11px; }
.stages .st.cur { border: 0; color: white; background: var(--teal); box-shadow: var(--shadow-small); }
.stages .st.cur b { color: #ff9b85; }
.stages .st.cur small { color: #d4e7e2; }
.ranked-page > h1, .ranked-page > .status { display: none; }
.ranked-page h2, .review-page h2, .method-page h2 { margin: 62px 0 14px; font-size: clamp(1.55rem, 2.5vw, 2.25rem); line-height: 1.15; }
.lede { color: var(--mut); font-size: 15px; }

#how { margin: 0 0 22px; padding: 0; border: 1px solid var(--line); border-radius: 16px; background: rgba(255,255,255,.66); box-shadow: none; }
#how > summary { margin: 0; padding: 17px 20px; border-radius: 16px; color: var(--ink); font-size: 14px; font-weight: 750; list-style-position: inside; }
#how[open] > summary { border-bottom: 1px solid var(--line); border-radius: 16px 16px 0 0; }
#how > :not(summary) { margin-left: 20px; margin-right: 20px; }
#how > :last-child { margin-bottom: 20px; }
#how ol { color: var(--mut); }
#purpose { margin-top: 20px; border: 0; border-left: 4px solid var(--acc); border-radius: 0 10px 10px 0; background: var(--card); }

#veh { margin: 24px 0 18px; padding: clamp(22px, 4vw, 42px); border: 1px solid var(--line); border-radius: 26px; background: var(--teal-soft); }
#veh h2 { margin-top: 0; }
#vehctl .ctlrow { gap: 12px; }
#vehctl label, #bar label { color: var(--mut); font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
#vehctl select, #vehctl input, #bar select, #bar input { display: block; margin-top: 4px; color: var(--ink); font-size: 13px; font-weight: 500; letter-spacing: 0; text-transform: none; }
#veh table { margin-top: 20px; }
#veh tr { transition: background .16s ease; }
#veh tr[data-path]:hover td { background: rgba(255,255,255,.62); }
#veh tr.on td { background: rgba(23,107,103,.13); }
#vtab .bar { height: 8px; border-radius: 999px; background: var(--teal); }

.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 16px; background: rgba(255,255,255,.7); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 12px 14px; border-bottom: 1px solid var(--line); text-align: right; }
th:first-child, td:first-child { text-align: left; }
tr:last-child td { border-bottom: 0; }
th { color: var(--mut); font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
tr.hi td { color: var(--teal); font-weight: 750; }

#rater { display: none; margin: 28px 0; padding: 24px; border: 1px solid var(--teal); border-radius: 18px; background: var(--teal-soft); }
.labelling #rater { display: block; }
#rater > strong { display: block; margin-bottom: 12px; font-size: 1.15rem; }
#rater br { display: none; }
#rater label { display: inline-block; margin: 0 10px 10px 0; font-size: 13px; font-weight: 700; }
#rater input, #rater select { margin-left: 5px; }

.note { margin: 18px 0; padding: 17px 20px; border: 0; border-left: 4px solid var(--acc); border-radius: 0 12px 12px 0; color: var(--ink-soft); background: #f0e9df; font-size: 14px; }
.legend { display: flex; gap: 7px; flex-wrap: wrap; margin: 0 0 16px; }
.pill { display: inline-flex; align-items: center; min-height: 24px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 999px; color: var(--mut); background: var(--card); font-size: 10px; line-height: 1.2; font-weight: 700; letter-spacing: .035em; text-transform: uppercase; }
.pill.s0 { color: var(--ok); border-color: rgba(25,112,93,.35); background: #e5f2ed; }
.pill.s2 { color: var(--warn); border-color: rgba(186,91,37,.3); background: #f7ece5; }
.pill.plant { color: var(--teal); border-color: rgba(23,107,103,.35); background: var(--teal-soft); }
.pill.new { color: var(--alt); border-color: rgba(101,84,164,.3); background: #eeebf8; }
.pill.old, .pill.veh, .pill.sim { border-color: var(--line-strong); }

#bar { position: sticky; top: 12px; z-index: 10; display: flex; gap: 10px; align-items: end; flex-wrap: wrap; margin: 0 0 18px; padding: 14px; border: 1px solid rgba(189,202,197,.9); border-radius: 16px; background: rgba(244,245,240,.92); box-shadow: var(--shadow-small); backdrop-filter: blur(14px); }
#bar select { max-width: 180px; }
#bar #fq { width: 145px; }
#bar #fr { color: var(--mut); background: transparent; }
#bar #ex { display: none; color: white; border-color: var(--teal); background: var(--teal); }
.labelling #bar #ex { display: inline-flex; }
.ranked-page:not(.labelling) #bar label:has(#fl) { display: none; }
#count { margin-left: auto; padding: 0 7px 10px; color: var(--mut); font-size: 12px; }

.row { position: relative; margin: 12px 0; padding: 20px 22px; border: 1px solid var(--line); border-radius: 17px; background: rgba(255,255,255,.82); box-shadow: 0 1px 0 rgba(255,255,255,.8) inset; transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease; }
.row:hover { border-color: var(--line-strong); box-shadow: var(--shadow-small); transform: translateY(-1px); }
.row.done { padding-left: 20px; border-left: 5px solid var(--ok); }
.meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.rank { min-width: 54px; color: var(--acc); font-size: 18px; line-height: 1; font-weight: 800; letter-spacing: -.03em; }
.phrase { font-family: Georgia, "Times New Roman", serif; font-size: clamp(1.35rem, 2.1vw, 1.75rem); line-height: 1.25; font-weight: 600; letter-spacing: -.015em; }
.phrase .pill.cnt { margin-left: 8px; vertical-align: middle; color: var(--teal); border-color: var(--teal); }
.row details > summary { display: inline-flex; align-items: center; min-height: 32px; margin-top: 10px; padding: 3px 9px; border-radius: 8px; color: var(--teal); background: var(--teal-soft); font-size: 12px; font-weight: 750; cursor: pointer; }
.ctx { margin: 12px 0 2px; padding: 14px 16px; border: 0; border-radius: 10px; color: var(--ink-soft); background: var(--card); font-size: 14px; }
mark { padding: 0 .08em; color: var(--ink); background: linear-gradient(transparent 60%, rgba(217,87,63,.24) 60%); font-weight: 750; border: 0; }
.lbl { display: none; gap: 7px; flex-wrap: wrap; margin-top: 14px; }
.labelling .lbl { display: flex; }
.lbl button { min-height: 34px; padding: 5px 10px; font-size: 12px; }
.lbl button.sel { color: white; border-color: var(--teal); background: var(--teal); }
#labelToggle { color: white; border-color: rgba(255,255,255,.28); background: rgba(255,255,255,.08); }
#labelToggle:hover { border-color: white; background: rgba(255,255,255,.15); }
textarea { width: 100%; min-height: 120px; margin-top: 12px; border: 1px solid var(--line); border-radius: 10px; }

/* Lightweight polish for the two blinded review screens and method notes. */
.review-page > .stages { margin-top: 0; }
.review-page > h1, .method-page > h1 { margin-top: 58px; font-size: clamp(2.3rem, 5vw, 4.3rem); }
.review-page .status { margin: 28px 0 22px; padding: 28px; border: 0; border-radius: 22px; color: white; background: var(--ink); box-shadow: var(--shadow); }
.review-page .status .l1 { font-size: clamp(1.35rem, 3vw, 2rem); }
.review-page .status .l2 { margin-top: 8px; color: #d0dede; }
.review-page .status .l3 { color: #9fb4b5; }
.review-page .status b { color: #ff9b85; }
.review-page #rater { display: block; }
.review-page .lbl { display: flex; }
.review-page #bar #ex { display: inline-flex; }
.method-page { max-width: 900px; }
.method-page > h1 { max-width: 780px; }
.method-page > .lede:first-of-type { margin: 26px 0 42px; font-size: 1.12rem; }
.method-page figure, .method-page .tw { margin: 30px 0; }
.method-page figure { padding: 24px; border: 1px solid var(--line); border-radius: 18px; background: rgba(255,255,255,.72); }
.method-page svg { width: 100%; height: auto; }

@media (max-width: 820px) {
  body { padding: 20px 18px 46px; }
  .site-header { margin-bottom: 20px; }
  .project-context { grid-template-columns: 64px minmax(0, 1fr); gap: 14px; }
  .project-context-link { grid-column: 2; justify-self: start; }
  .loader-page .loader { border-radius: 22px; }
  .loader-steps { grid-template-columns: 1fr; }
  .loader-steps li { display: grid; grid-template-columns: 36px 1fr; gap: 14px; }
  .loader-steps li b { margin-bottom: 0; }
  .loader-steps li strong, .loader-steps li p { grid-column: 2; }
  .loader-steps li strong { grid-row: 1; }
  .loader-steps li p { grid-row: 2; }
  .site-footer { grid-template-columns: 1fr; }
  .footer-links { justify-content: flex-start; }
  .footer-privacy { text-align: left; }
  .home-hero, .rank-hero, .section-heading { grid-template-columns: 1fr; }
  .home-hero { gap: 38px; padding: 20px 0 58px; }
  .hero-proof { max-width: 500px; }
  .workflow-grid { grid-template-columns: 1fr; }
  .menu-goal { grid-template-columns: 1fr; gap: 28px; align-items: start; }
  .menu-goal .menu-link { width: fit-content; }
  .method-steps { grid-template-columns: 1fr; }
  .method-step { min-height: 0; }
  .method-number { margin-bottom: 28px; }
  .workflow-card { min-height: 285px; }
  .evidence-grid { grid-template-columns: 1fr; }
  .evidence-card { min-height: 340px; }
  .section-block { padding-top: 78px; }
  .section-heading { gap: 18px; }
  .evidence-section { padding-bottom: 78px; }
  .rank-hero { gap: 34px; padding: 34px 26px; border-radius: 22px; }
  .rank-metrics { grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .rank-metric { display: block; padding: 12px 0; border-right: 1px solid rgba(255,255,255,.2); border-bottom: 0; }
  .rank-metric:last-child { border-right: 0; }
  .rank-metric span { display: block; margin-top: 6px; }
  .dataset-strip { grid-template-columns: 1fr; gap: 24px; }
  .rank-logic { grid-template-columns: 1fr; gap: 24px; }
  .output-routes { grid-template-columns: 1fr; }
  .stages .st { grid-template-columns: 28px 1fr; padding: 8px; }
  #bar { top: 6px; max-height: 55vh; overflow-y: auto; }
  #count { width: 100%; margin-left: 0; }
}

@media (max-width: 560px) {
  .header-tag { display: none; }
  .site-nav a:not(.nav-output) { display: none; }
  .site-header { min-height: 52px; gap: 12px; flex-wrap: wrap; }
  .project-logo-wrap { width: 40px; height: 40px; flex-basis: 40px; }
  .project-logo { width: 31px; height: 25px; }
  .brand-copy strong { font-size: 12px; }
  .brand-copy small { max-width: 180px; font-size: 8px; }
  .brand-tool { display: none; }
  .header-actions { gap: 5px; }
  .language-actions { width: 100%; }
  .language-actions .langswitch { display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; }
  .header-actions .button { width: auto; min-height: 40px; padding: 8px 10px; }
  .langswitch { gap: 3px; }
  .langbtn { min-width: 38px; min-height: 38px; padding: 4px 7px; }

data}.","lede_filter":"{stream}{n} udtryk i tilfældig rækkefølge{folded}. Der vises intet om, hvordan programmet har vurderet eller rangordnet dem, så vurderingen er helt din egen. Markér dem, der er værd at forelægge panelet. Nogle af dem blev vurderet lavt af programmet og andre højt — det er med vilje, og ved bagefter at sammenligne dine valg med dets rækkefølge finder vi ud af, om rækkefølgen kan stoles på.","lede_stream":"Kun {stream}. ","lede_folded":" (identiske formuleringer vises én gang med et antal; {m} yderligere passager er foldet ind under dem, og én vurdering dækker dem alle)","lede_vote":"{n} udtryk, som forskere har udvalgt som værd at overveje, vist i tilfældig rækkefølge. For hvert udtryk: kunne det høre hjemme på en menu, der tilbydes mennesker, der lever med kræft — noget en patient kunne genkende og bruge om sin egen oplevelse? Der er ingen rigtige svar, og din mening kan afvige fra andre paneldeltageres. Det er netop meningen.","lede_explore":"{N} kandidater ordnet efter verifikation med en anden modelfamilie og derefter registrerede kontroller for sygdomsrelevans, levet erfaring og lighed med menuen, med billedstyrke som afgørende faktor. {note}","how_summary":"Mere om denne side, og hvordan listen blev lavet","how_summary_short":"Mere om denne side","how_filter":"{page}de {top} højest placerede kandidater i systemets rækkefølge plus {deep}, der er trukket usete længere nede fra listen, blandet sammen — {n} rækker i alt (identiske formuleringer slået sammen). Intet er kasseret: de øvrige kandidater findes stadig i den rangordnede liste og i projektgruppens arbejdskopi.","how_filter_page":"Denne side: ","how_filter_stream":"Denne side: kun kandidaterne fra {stream} — ","how_vote":"Denne side: de {n} udtryk, forskerne lod gå videre i trin 1, blandet og uden oplysninger om rækkefølge.","how_explore":"Denne side: hele den rangordnede liste, alle {N} kandidater, med hver kontrols resultat og filter.","rater_heading":"Før du begynder — hvem vurdere agina verstuurt niets zodra ze open is.","loader_error":"Dat bestand is geen beoordelingslijst. Kies het .json-bestand dat u heeft ontvangen.","loader_other":"Ander bestand openen","stage_1":"Filteren","stage_1_who":"onderzoekers","stage_2":"Stemmen","stage_2_who":"patiëntenpanel","stage_3":"Terugblik","stage_3_who":"projectteam","mode_filter":"stap 1 van 3 — filteren","mode_vote":"stap 2 van 3 — stemmen","mode_explore":"stap 3 van 3 — terugblik (werkversie)","status_filter_1":"<b>NIET GERANGSCHIKT.<\/b> Willekeurige volgorde, met opzet — de rangorde is verborgen zodat uw keuzes haar kunnen toetsen.","status_filter_2":"<b>UW TAAK:<\/b> markeer de uitdrukkingen die het waard zijn om aan het panel voor te leggen.","status_filter_3":"Sommige rijen komen van diep in de lijst. De rangorde staat in {ranked}.","status_vote_1":"<b>NIET GERANGSCHIKT.<\/b> Willekeurige volgorde, geen scores.","status_vote_2":"<b>UW TAAK:<\/b> zeg of elke uitdrukking thuishoort op een menu voor mensen die leven met kanker.","status_vote_3":"Er zijn geen goede antwoorden; van panelleden wordt verwacht dat ze het oneens zijn.","status_explore_1":"<b>GERANGSCHIKT.<\/b> De beste kandidaten eerst, zoals de software ze ordende.","status_explore_2":"<b>DOEL:<\/b> zien waar de uitdrukkingen die mensen behielden stonden, en bladeren op brondomein.","status_explore_3":"Niet voor het verzamelen van oordelen. Ingeplante controle-items zijn blauw gemarkeerd.","ranked_link":"de gerangschikte lijst (stap 3)","stage3":"stap 3","purpose_filter":"<strong>Doel:<\/strong> een eerste filtering. Markeer welke kandidaat-uitdrukkingen het waard zijn om aan het panel voor te leggen. <strong>Gegevens:<\/strong> {data}. Uw oordelen worden achteraf vergeleken met de volgorde van de software — zo leren we of die volgorde te vertrouwen is — daarom is de volgorde bewust voor u verborgen.","purpose_vote":"<strong>Doel:<\/strong> beslissen wat op het menu komt. Deze uitdrukkingen zijn al gefilterd door onderzoekers; u beoordeelt of elke uitdrukking erbij hoort. <strong>Gegevens:<\/strong> {data}. Meerdere mensen stemmen onafhankelijk van elkaar en onenigheid is verwacht.","purpose_explore":"<strong>Doel:<\/strong> stap 3, nadat de stemmen binnen zijn. Het projectteam bekijkt hoe het systeem zijn uitvoer ordende en waar de uitdrukkingen die mensen behielden in de rangorde stonden — bijvoorbeeld of alles wat het menu haalde in de bovenste paar honderd zat. Niet voor het verzamelen van oordelen. <strong>Gegevens:<\/strong> {data}.","lede_filter":"{stream}{n} uitdrukkingen in willekeurige volgorde{folded}. Er wordt niets getoond over hoe de software ze beoordeelde of rangschikte, dus uw oordeel is helemaal uw eigen oordeel. Markeer de uitdrukkingen die het waard zijn om aan het panel voor te leggen. Sommige zijn door de software laag beoordeeld en andere hoog — dat is met opzet, en door uw keuzes achteraf met die volgorde te vergelijken ontdekken we of de volgorde te vertrouwen is.","lede_stream":"Alleen {stream}. ","lede_folded":" (identieke formuleringen worden één keer getoond met een aantal; {m} andere passages zijn eronder samengevouwen, en één oordeel geldt voor allemaal)","lede_vote":"{n} uitdrukkingen die onderzoekers selecteerden als het overwegen waard, in willekeurige volgorde. Voor elke uitdrukking: zou dit thuishoren op een menu voor mensen die leven met kanker — iets wat een patiënt zou herkennen en zou kunnen gebruiken voor de eigen ervaring? Er zijn geen goede antwoorden, en uw mening mag afwijken van die van andere panelleden. Dat is juist de bedoeling.","lede_explore":"{N} kandidaten, geordend na verificatie door een tweede modelfamilie en daarna vastgelegde controles op ziekterelevantie, geleefde ervaring en gelijkenis met het menu, met beeldkracht als doorslag. {note}","how_summary":"Meer over deze pagina en hoe de lijst is gemaakt","how_summary_short":"Meer over deze pagina","how_filter":"{page}de {top} hoogst geplaatste kandidaten in de volgorde van het systeem, plus { <script>
/* Metaphor review app — ONE page for every language and every stage.
 *
 * The page carries no data of its own. It renders a "review bundle" (JSON written by
 * review_page.py): either embedded in the page (<script id="bundle" type="application/json">,
 * the public English demo) or chosen by the reviewer through the file picker on the start
 * screen (the private Danish and Dutch lists). The bundle's `lang` selects the UI language,
 * and everything else — provenance, tables, plant check, candidates — comes from the bundle.
 *
 * Nothing leaves the browser: the file is read with FileReader, labels autosave to
 * localStorage, and the export is a download of ids + verdicts only.
 */
(function () {
  'use strict';
  const I18N = JSON.parse(document.getElementById('i18n').textContent);
  let LANG = 'en', T = I18N.en;
  const VERDICTS = ['yes', 'maybe', 'no', 'unsure'];

  function t(key, vars) {
    let s = T[key]; if (s === undefined) s = I18N.en[key]; if (s === undefined) return key;
    if (Array.isArray(s)) return s;
    if (vars) for (const k in vars) s = s.split('{' + k + '}').join(vars[k]);
    return s;
  }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function num(n) { try { return Number(n).toLocaleString(LANG === 'en' ? 'en-GB' : LANG); } catch (e) { return String(n); } }
  function pct(x, d) { return (d === undefined ? Number(x).toFixed(1) : Number(x).toFixed(d)) + '%'; }
  function setLang(l) { LANG = I18N[l] ? l : 'en'; T = I18N[LANG]; document.documentElement.lang = LANG; }
  function browserLang() { const l = ((navigator.language || 'en').slice(0, 2)).toLowerCase(); return I18N[l] ? l : 'en'; }

  // Official 4D PICTURE icon, kept inline so the review page remains self-contained and

  <p class="footer-privacy">${esc(t('footer'))}</p>
</footer>`;

  // ------------------------------------------------------------------ start screen ---
  function renderLoader(lang, error) {

    document.title = t('app_title');

      `<button type="button" class="langbtn${l === LANG ? ' on' : ''}" data-lang="${l}">${esc(I18N[l].lang_name)}</button>`).join('');
    document.getElementById('app').innerHTML = `
${siteHeader(`<span class="langswitch" role="group" aria-label="${esc(t('language_label'))}">${langs}</span>`, 'language-actions')}
${projectContext()}
<section class="loader">
  <p class="eyebrow">${esc(t('loader_eyebrow'))}</p>
  <h1>${esc(t('loader_title'))}</h1>
  <p class="lede">${esc(t('loader_lede'))}</p>
  ${error ? `<div class="note loader-error" role="alert">${esc(t('loader_error'))}</div>` : ''}

    <label class="button primary filebtn">${esc(t('loader_button'))}<input type="file" id="file" accept=".json,application/json"></label>
    <span class="drophint">${esc(t('loader_drop'))}</span>
  </div>
  <ol class="loader-steps">
    <li><b>1</b><div><strong>${esc(t('loader_step1'))}</strong><p>${esc(t('loader_step1_text'))}</p></div></li>
    <li><b>2</b><div><strong>${esc(t('loader_step2'))}</strong><p>${esc(t('loader_step2_text'))}</p></div></li>
    <li><b>3</b><div><strong>${esc(t('loader_step3'))}</strong><p>${esc(t('loader_step3_text'))}</p></div></li>
  </ol>
  <p class="privacy">${esc(t('loader_privacy'))}</p>
</section>
${siteFooter()}`;
    document.querySelectorAll('.langbtn').forEach(b => b.onclick = () => renderLoader(b.dataset.lang, false));
    const inp = document.getElementById('file');
    inp.onchange = () => { if (inp.files[0]) loadFile(inp.files[0]); };
    const drop = document.getElementById('drop');
    drop.ondragover = ev => { ev.preventDefault(); drop.classList.add('over'); };
    drop.ondragleave = () => drop.classList.remove('over');
    drop.ondrop = ev => { ev.preventDefault(); drop.classList.remove('over'); const f = ev.dataTransfer.files[0]; if (f) loadFile(f); };
  }

  function loadFile(file) {
    const rd = new FileReader();
    rd.onload = () => {
      let B = null;
      try { B = JSON.parse(rd.result); } catch (e) { B = null; }
      if (B && B.format === 'metaphor-review-bundle-encrypted') { renderPassScreen(B, file.name, ''); return; }
      if (!B || B.format !== 'metaphor-review-bundle' || !Array.isArray(B.rows)) { renderLoader(LANG, true); return; }
      B._fromFile = true;
      render(B);
      window.scrollTo(0, 0);
    };
    rd.readAsText(file);
  }

  // ---- encrypted lists: PBKDF2-SHA256 → AES-256-GCM, decrypted here with WebCrypto ----
  function b64(s) { const bin = atob(s); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
  async function decryptBundle(E, pass) {
    const enc = new TextEncoder();
    const km = await crypto.subtle.importKey('raw', enc.encode(pass.normalize('NFKC').trim()), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(E.kdf.salt), iterations: E.kdf.iterations, hash: E.kdf.hash },
      km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(E.cipher.iv) }, key, b64(E.data));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  function renderPassScreen(E, fname, error) {
    setLang(E.lang);
    document.body.className = 'review-page loader-page';
    document.title = t('app_title');
    const noCrypto = !(window.crypto && crypto.subtle);
    document.getElementById('app').innerHTML = `
${siteHeader(`<button type="button" class="button secondary" id="reload">${esc(t('loader_other'))}</button>`)}
${projectContext()}
<section class="loader">
  <p class="eyebrow">${esc(t('pass_eyebrow'))}</p>
  <h1>${esc(t('pass_title'))}</h1>
  <p class="lede">${esc(t('pass_lede', { file: fname }))}</p>
  ${E.corpus ? `<p class="lede"><strong>${esc(E.corpus)}</strong> · <code>${esc(E.list_id || '')}</code></p>` : ''}
  ${error ? `<div class="note loader-error" role="alert">${esc(error)}</div>` : ''}
  ${noCrypto ? `<div class="note loader-error" role="alert">${esc(t('pass_nocrypto'))}</div>` : `
  <form id="passform" class="passform">
    <label>${esc(t('pass_label'))} <input id="pass" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" size="32" autofocus></label>
    <label class="showpass"><input type="checkbox" id="passshow"> ${esc(t('pass_show'))}</label>
    <button type="submit" class="button primary" id="passgo">${esc(t('pass_button'))}</button>
  </form>`}
  <p class="privacy">${esc(t('loader_privacy'))}</p>
</section>
${siteFooter()}`;
    document.getElementById('reload').onclick = () => renderLoader(LANG, false);
    const f = document.getElementById('passform'); if (!f) return;
    document.getElementById('passshow').onchange = ev => { document.getElementById('pass').type = ev.target.checked ? 'text' : 'password'; };
    f.onsubmit = async ev => {
      ev.preventDefault();
      const btn = document.getElementById('passgo'); btn.disabled = true;
      try {
        const B = await decryptBundle(E, document.getElementById('pass').value);
        if (!B || B.format !== 'metaphor-review-bundle' || !Array.isArray(B.rows)) throw new Error('not a bundle');
        B._fromFile = true; render(B); window.scrollTo(0, 0);
      } catch (e) { renderPassScreen(E, fname, t('pass_error')); }
    };
  }

  // ---------------------------------------------------------------------- helpers ---
  function highlight(text, phrase) {
    const e = esc(text), ph = String(phrase || '').trim();
    if (ph.length < 3) return e;
    const words = esc(ph).split(/\s+/).map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
    try { return e.replace(new RegExp('(' + words.join('\\s+') + ')', 'i'), '<mark>$1</mark>'); }
    catch (err) { return e; }
  }
  function statsRow(label, s, hi, full) {
    return `<tr${hi ? " class='hi'" : ''}><td>${esc(label)}</td><td>${num(s.n)}</td><td>${pct(s.keep, hi ? 0 : 1)}</td>`
      + `<td>${pct(s.exp, hi ? 0 : 1)}</td><td>${num(s.median)}</td>`
      + (full ? `<td>${pct(s.top10, hi ? 0 : 1)}</td><td>${pct(s.bottom, hi ? 0 : 1)}</td>` : '') + '</tr>';
  }

  // ------------------------------------------------------------------ page blocks ---
  function header(B, blind) {
    const tag = B.header_tag || ((blind ? t('header_tag_blind') : t('header_tag_ranked')) + (B.private ? t('header_tag_private') : ''));

  }
  function stageStrip(stage) {
    const cur = { filter: 1, vote: 2, explore: 3 }[stage];

      `<span class="st${n === cur ? ' cur' : ''}"><b>${n}</b> ${esc(t('stage_' + n))}<small>${esc(t('stage_' + n + '_who'))}</small></span>`).join('') + '</nav>';
  }
  function hero(B) {
    const pub = B.private ? '' : t('hero_public');
    return `<section class="rank-hero"><div>
    <p class="eyebrow">${esc(t('hero_eyebrow'))}</p><h1>${esc(t('hero_title'))}</h1>
    <p class="hero-lede">${esc(t('hero_lede', { pub }))}</p>

    <div class="rank-metric"><strong>${num(B.counts.n_plants_in_rows)}</strong><span>${esc(t('metric_plants'))}</span></div></div></section>`;

  function rankLogic(B) {

  function statusBlock(B) {

  }
  function howBox(B) {
    const c = B.counts, data = esc((B.source_note || B.corpus).replace(/\.$/, ''));
    const purpose = t('purpose_' + B.stage, { data });
    let lede;
    if (B.stage === 'filter') lede = t('lede_filter', {
      stream: B.stream ? t('lede_stream', { stream: B.stream_label || B.stream }) : '', n: num(c.n_rows),
      folded: c.n_folded ? t('lede_folded', { m: num(c.n_folded) }) : '' });
    else if (B.stage === 'vote') lede = t('lede_vote', { n: num(c.n_rows) });
    else lede = t('lede_explore', { N: num(c.n_total), note: esc(B.source_note || '') });
    const steps = (B.provenance_steps || []).slice();
    if (steps.length) {
      if (B.stage === 'filter') steps.push(t('how_filter', {
        page: B.stream ? t('how_filter_stream', { stream: B.stream_label || B.stream }) : t('how_filter_page'),
        top: num(c.n_top), deep: num(c.n_deep), n: num(c.n_rows) }));
      else if (B.stage === 'vote') steps.push(t('how_vote', { n: num(c.n_rows) }));
      else steps.push(t('how_explore', { N: num(c.n_total) }));
    }
    return `<details id="how"${B.stage !== 'explore' ? ' open' : ''}><summary>${esc(steps.length ? t('how_summary') : t('how_summary_short'))}</summary>
  <div id="purpose">${purpose}</div><p class="lede">${lede}</p>${steps.length ? '<ol>' + steps.map(s => `<li>${esc(s)}</li>`).join('') + '</ol>' : ''}</details>`;
  }
  function raterBox(B) {
    const def = { vote: 'ppi', filter: 'researcher', explore: '' }[B.stage];
    const opts = (def ? '' : `<option value="">${esc(t('role_choose'))}</option>`) + ['ppi', 'researcher', 'clinician', 'other'].map(v =>
      `<option value="${v}"${v === def ? ' selected' : ''}>${esc(t('role_' + v))}</option>`).join('');
    return `<div id="rater"><strong>${esc(B.stage === 'explore' ? t('rater_heading_explore') : t('rater_heading'))}</strong><br>
  <label>${esc(t('rater_name'))} <input id="rname" placeholder="${esc(t('rater_name_ph'))}" size="18"></label>
  <label>${esc(t('rater_role'))} <select id="rrole">${opts}</select></label>
  <span id="rstate" style="color:var(--mut);font-size:13px"></span>
  <p class="lede" style="margin:8px 0 0">${t('rater_privacy')}</p></div>`;
  }
  function behaved(B) {
    const S = B.stats; if (!S) return '';
    let h = `<h2>${esc(t('behaved_heading'))}</h2><div class="tw"><table><tr><th></th><th>${esc(t('th_items'))}</th><th>${esc(t('th_keep'))}</th><th>${esc(t('th_exp'))}</th><th>${esc(t('th_median'))}</th><th>${esc(t('th_top10'))}</th><th>${esc(t('th_bottom'))}</th></tr>`;
    if (S.plant) h += statsRow(t('plant_row'), S.plant, true, true);
    h += statsRow(t('pool_row'), S.pool, false, true) + '</table></div>';
    return h;
  }
  function plantBlock(B) {
    const P = B.plants; if (!P || !B.stats || !B.stats.plant) return '';
    const excl = P.excl_entries && P.excl_entries.length ? t('plant_excl', {
      k: P.excl_entries.length, rows: P.excl_rows ? t('plant_excl_rows', { rows: num(P.excl_rows) }) : '' }) : '';
    let h = `<h2>${esc(t('plant_heading'))}</h2><p class="lede">${t('plant_text', {
      kind: LANG === 'en' && !B.translated_plants ? t('plant_kind_published') : t('plant_kind_translated'),
      nl_note: B.lang === 'nl' ? t('plant_nl_note') : '', n_entries: num(P.n_entries), median: num(B.stats.plant.median),
      N: num(P.N), excl })}</p>`;
    if (P.ranks && P.ranks.length) {
      const W = 760, LX = 90, RX = 740, N = Math.max(2, P.N);
      const sx = r => LX + Math.log(Math.max(1, r)) / Math.log(N) * (RX - LX);
      const ticks = [1, 10, 100, 1000, 10000, 100000].filter(x => x < N).map(x =>
        `<line x1="${sx(x).toFixed(0)}" y1="26" x2="${sx(x).toFixed(0)}" y2="96" class="grid"/><text x="${sx(x).toFixed(0)}" y="115" class="tick">${num(x)}</text>`).join('')
        + `<line x1="${RX}" y1="26" x2="${RX}" y2="96" class="grid"/><text x="${RX}" y="115" class="tick">${num(N)}</text>`;
      const dots = P.ranks.map(([id, r, ph]) => `<circle cx="${sx(r).toFixed(1)}" cy="60" r="6" class="dot held"><title>${esc(id)} · #${num(r)} · ${esc(ph || '')}</title></circle>`).join('');
      h += `<h2>${esc(t('plant_strip_heading'))}</h2><p class="lede">${esc(t('plant_strip_lede', { N: num(P.N) }))}</p>
  <figure class="plantstrip"><svg viewBox="0 0 ${W} 124" role="img" aria-label="${esc(t('plant_strip_heading'))}"><text x="${LX - 8}" y="64" class="lane">${esc(t('plant_strip_lane'))}</text>${ticks}${dots}</svg></figure>
  <div class="tw"><table><tr><th>#</th><th>${esc(t('th_median'))}</th><th></th></tr>${P.ranks.slice().sort((a, b) => a[1] - b[1]).map(([id, r, ph]) =>
        `<tr><td>${esc(id)}</td><td>${num(r)}</td><td style="text-align:left">${esc(ph || '')}</td></tr>`).join('')}</table></div>`;
    }
    return h;
  }
  function provBlock(B) {
    if (!B.has_old) return '';
    return `<h2>${esc(t('prov_heading'))}</h2><p class="lede">${t('prov_text', { old: esc(B.old_label), n: num(B.rows.length - B.counts.n_plants_in_rows), both: num(B.n_old), new: num(B.n_new) })}</p>`;
  }
  function byStratum(B) {
    const S = B.stats; if (!S || !S.by_stratum) return '';
    return `<h2>${esc(t('by', { noun: B.stratum_noun }))}</h2><div class="tw"><table><tr><th>${esc(B.stratum_noun)}</th><th>${esc(t('th_items'))}</th><th>${esc(t('th_keep'))}</th><th>${esc(t('th_exp'))}</th><th>${esc(t('th_median'))}</th></tr>`
      + S.by_stratum.map(([name, s]) => statsRow(name, s, false, false)).join('') + '</table></div>';
  }
  function scoreNote(B) {
    const S = B.stats; if (!S || S.score_mean === undefined) return '';
    return `<div class="note">${t('score_note', { mean: Number(S.score_mean).toFixed(2), median: Number(S.score_median).toFixed(1) })}</div>`;
  }
  function vehSection(B) {
    const cov = B.layers_cov || {}; if (!Object.values(cov).some(v => v)) return '';
    const opts = [['usas', cov.usas], ['veh', cov.usas], ['head', cov.head], ['wn1', cov.wn1], ['wn2', cov.wn2], ['fn', cov.fn], ['llm', cov.llm], ['llm_c1', cov.llm_c1], ['llm_c2', cov.llm_c2]];
    const top = cov.usas ? 'veh' : (cov.head ? 'head' : '');
    const sel = opts.map(([k, n]) => `<option value="${k}"${n ? '' : ' disabled'}${k === top ? ' selected' : ''}>${esc(t('layer_' + k))}${n ? '' : esc(t('veh_not_computed'))}</option>`).join('');
    const sel2 = `<option value="">${esc(t('veh_nothing'))}</option>` + opts.filter(([k]) => k !== 'usas').map(([k, n]) =>
      `<option value="${k}"${n ? '' : ' disabled'}>${esc(t('layer_' + k))}</option>`).join('');
    const fam = (B.fam && B.fam[1]) ? `<div class="ctlrow"><label>${esc(t('veh_from_model'))} <select id="vfam"><option value="a">${esc(B.fam[0])}</option><option value="b">${esc(B.fam[1])}</option><option value="agree">${esc(t('veh_agree', { n: num(B.n_agree || 0) }))}</option></select></label></div>` : '';
    return `<div id="veh"><h2>${esc(t('veh_heading'))}</h2><p class="lede">${t('veh_lede')}</p>
  <div id="vehctl">${fam}<div class="ctlrow"><label>${esc(t('veh_groupby'))} <select id="vlayer">${sel}</select></label>
  <label>${esc(t('veh_thenby'))} <select id="vlayer2">${sel2}</select></label>
  <label>${esc(t('veh_top'))} <input id="vtop" type="number" min="1" max="${B.rows.length}" value="${B.rows.length}" size="5"> ${esc(t('veh_of', { n: num(B.rows.length) }))}</label>
  <span id="vcov" style="color:var(--mut)"></span><button id="vclear">${esc(t('veh_clear'))}</button></div></div>
  <div class="tw"><table id="vtab"></table></div></div>`;
  }
  function bar(B, blind) {
    let f;
    if (blind) f = '<span style="display:none"><select id="fs"></select><select id="ft"></select><select id="fp"></select><select id="fm"></select><select id="fv"></select><select id="fc"></select></span>';
    else {
      f = `<label>${esc(B.stratum_noun)} <select id="fs"><option value="">${esc(t('f_all'))}</option>${(B.strata || []).map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('')}</select></label>`
        + `<label>${esc(t('f_screen'))} <select id="ft"><option value="">${esc(t('f_all'))}</option><option value="0">${esc(t('tier_0'))}</option><option value="1">${esc(t('tier_1'))}</option><option value="2">${esc(t('tier_2_pl'))}</option></select></label>`
        + ((B.veh_cats || []).length ? `<label>${esc(t('f_domain'))} <select id="fv"><option value="">${esc(t('f_all'))}</option>${B.veh_cats.map(([k, c]) => `<option value="${esc(k)}">${esc(k)} (${c})</option>`).join('')}</select></label>` : '')
        + ((B.veh_codes || []).length ? `<label>${esc(t('f_code'))} <select id="fc"><option value="">${esc(t('f_all'))}</option>${B.veh_codes.map(([k, d, c]) => `<option value="${esc(k)}">${esc(k)} — ${esc(d)} (${c})</option>`).join('')}</select></label>` : '')
        + (B.simile ? `<label>${esc(t('f_expr'))} <select id="fm"><option value="">${esc(t('f_all'))}</option><option value="1">${esc(t('f_marker'))}</option><option value="0">${esc(t('f_nomarker'))}</option></select></label>` : '')
        + `<label>${esc(t('f_prov'))} <select id="fp"><option value="">${esc(t('f_all'))}</option><option value="new">${esc(t('f_prov_new'))}</option><option value="both">${esc(t('f_prov_both', { old: B.old_label || '' }))}</option><option value="plant">${esc(t('f_prov_plant'))}</option></select></label>`;
    }
    return `<div id="bar">${f}<label>${esc(t('f_show'))} <select id="fl"><option value="">${esc(t('f_everything'))}</option><option value="todo">${esc(t('f_todo'))}</option><option value="yes">${esc(t('f_yes'))}</option><option value="maybe">${esc(t('f_maybe'))}</option></select></label>
  <label>${esc(t('f_search'))} <input id="fq" placeholder="${esc(t('f_search_ph'))}" size="14"></label>
  <button id="fr">${esc(t('f_reset'))}</button><button id="ex">${esc(t('f_export'))}</button><span id="count"></span></div>`;
  }
  function rowHtml(B, r, blind, btns) {
    const attrs = [];
    if (blind) attrs.push('data-stratum="" data-tier="" data-prov=""');
    else {
      const a = { stratum: r.stratum, tier: r.tier, prov: r.prov, simile: r.simile ? 1 : 0, veh: r.veh, vehcode: r.veh_code, rank: r.rank,
        vehb: r.veh_b, vehcodeb: r.veh_code_b, codeagree: r.code_agree, catagree: r.cat_agree, vehmain: r.veh_main, vehmainb: r.veh_main_b, mainagree: r.main_agree };
      for (const k in a) attrs.push(`data-${k}="${esc(a[k] == null ? '' : a[k])}"`);
      const ly = r.layers || {};
      for (const k of ['head', 'wn1', 'wn2', 'fn', 'llm', 'llm_c1', 'llm_c2']) attrs.push(`data-${k}="${esc(ly[k] || '')}"`);
    }
    attrs.push(`data-members="${esc(JSON.stringify(r.members || []))}" data-id="${esc(r.id)}"`);
    let meta;
    if (blind) meta = B.stage === 'filter' ? `<div class="meta"><span class="rank">${r.no} / ${B.rows.length}</span></div>` : '<div class="meta"></div>';
    else {
      const provpill = r.prov === 'plant' ? `<span class="pill plant">${esc(t('pill_plant'))}</span>`
        : r.prov === 'both' ? `<span class="pill old">${esc(t('pill_both', { old: B.old_label || '' }))}</span>` : `<span class="pill new">${esc(t('pill_new'))}</span>`;
      meta = `<div class="meta"><span class="rank">#${r.rank}</span><span class="pill s${r.tier}">${esc(t('tier_' + r.tier))}</span><span class="pill">${esc(t('pill_score', { s: Math.round(r.score) }))}</span>`
        + `<span class="pill">${esc(r.vivid ? t('pill_vivid') : t('pill_conventional'))}</span><span class="pill src">${esc(r.stratum)}</span>${provpill}`
        + (r.simile ? `<span class="pill sim">${esc(t('pill_simile'))}</span>` : '')
        + (r.veh ? `<span class="pill veh">${esc(r.veh_label || r.veh)}${r.veh_desc ? ' &middot; ' + esc(r.veh_desc) : ''}</span>` : '') + '</div>';
    }
    const n = r.n_pass || 1, vars = r.variants || [];
    const cnt = (r.members && r.members.length) ? `<span class="pill cnt" title="${esc(t('x_passages_title', { n }))}">&times;${esc(t('passages_n', { n }))}</span>` : '';
    const nv = r.n_variants || vars.length;
    const more = nv > 12 ? `<p class="ctx"><em>${esc(t('more_passages', { n: nv - 12 }))}</em></p>` : '';
    return `<div class="row" ${attrs.join(' ')}>${meta}<div class="phrase">${esc(r.phrase)}${cnt}</div>`
      + `<details><summary>${esc(t('context'))}${(r.members && r.members.length) ? ' · ' + esc(t('passages_n', { n })) : ''}</summary><p class="ctx">${highlight(r.text || '', r.phrase)}</p>`
      + vars.slice(0, 12).map(v => `<p class="ctx">${highlight(v.text || '', v.phrase || r.phrase)}</p>`).join('') + more + '</details>'
      + `<div class="lbl" data-for="${esc(r.id)}">` + VERDICTS.map((v, i) => `<button data-v="${v}">${esc(btns[i])}</button>`).join('') + '</div></div>';
  }

  // ------------------------------------------------------------------------ render ---
  function render(B) {
    setLang(B.lang);
    const blind = B.stage !== 'explore';
    document.body.className = blind ? 'review-page' : 'ranked-page';
    document.title = B.corpus + ' — ' + t('mode_' + B.stage);
    const btns = t('btn_' + B.stage);
    const h = [header(B, blind), projectContext(), stageStrip(B.stage)];
    if (!blind) { h.push(hero(B)); if (B.dataset_strip_html) h.push(B.dataset_strip_html); h.push(rankLogic(B)); }
    h.push(`<h1>${esc(B.corpus)} — ${esc(t('mode_' + B.stage))}</h1>`, statusBlock(B));
    if (!blind) h.push(vehSection(B));
    h.push(howBox(B), raterBox(B));
    if (!blind) h.push(behaved(B), plantBlock(B), provBlock(B), byStratum(B), scoreNote(B));
    h.push(`<div class="note">${B.private ? t('data_private') : t('data_public')}</div>`);
    h.push(!blind ? `<h2 id="candidates">${esc(t('cand_heading_ranked'))}</h2><p class="lede">${esc(t('cand_lede_ranked'))}</p>` : `<h2 id="candidates">${esc(t('cand_heading'))}</h2>`);
    if (!blind) h.push(`<div class="legend"><span class="pill plant">${esc(t('legend_plant'))}</span><span class="pill s0">${esc(t('legend_s0'))}</span><span class="pill s1">${esc(t('legend_s1'))}</span><span class="pill s2">${esc(t('legend_s2'))}</span><span class="pill new">${esc(t('legend_new'))}</span><span class="pill old">${esc(t('legend_old'))}</span></div>`);
    h.push(bar(B, blind), '<div id="returnbox" hidden></div>');   // confirmation sits right under the sticky bar with the export button
    h.push(B.rows.map(r => rowHtml(B, r, blind, btns)).join(''));
    h.push('<textarea id="out"></textarea>', siteFooter());
    document.getElementById('app').innerHTML = h.join('\n');
    behaviour(B, blind);
    const rl = document.getElementById('reload'); if (rl) rl.onclick = () => renderLoader(LANG, false);
  }

  // --------------------------------------------------------------------- behaviour ---
  function behaviour(B, blind) {
    const KEY = 'labels::' + (B.corpus_key || B.corpus) + (B.stage !== 'filter' ? '::' + B.stage : '') + (B.stream ? '::' + B.stream : '');
    let L = {};
    try { L = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { L = {}; }
    const $ = id => document.getElementById(id);
    const rn = $('rname'), rr = $('rrole');
    try { rn.value = localStorage.getItem(KEY + '::name') || ''; const rv = localStorage.getItem(KEY + '::role'); if (rv) rr.value = rv; } catch (e) { }
    function saveRater() {
      try { localStorage.setItem(KEY + '::name', rn.value); localStorage.setItem(KEY + '::role', rr.value); } catch (e) { }
      $('rstate').textContent = (rn.value && rr.value) ? t('rater_saved') : t('rater_needed');
    }
    rn.oninput = saveRater; rr.onchange = saveRater; saveRater();

    const rows = [...document.querySelectorAll('.row')];
    function paint(r) {
      const v = L[r.dataset.id];
      r.classList.toggle('done', !!v);
      r.querySelectorAll('.lbl button').forEach(b => b.classList.toggle('sel', b.dataset.v === v));
    }
    document.querySelectorAll('.lbl').forEach(g => g.addEventListener('click', ev => {
      const b = ev.target.closest('button'); if (!b) return;
      const id = g.dataset.for;
      if (L[id] === b.dataset.v) delete L[id]; else L[id] = b.dataset.v;
      try { localStorage.setItem(KEY, JSON.stringify(L)); } catch (e) { }
      paint(g.closest('.row')); apply();
    }));

    let GX = [];
    const val = id => ($(id) || { value: '' }).value;
    function apply() {
      const s = val('fs'), tt = val('ft'), p = val('fp'), l = val('fl'), mk = val('fm'), vh = val('fv'), vc = val('fc'), q = val('fq').trim().toLowerCase();
      let n = 0;
      for (const r of rows) {
        const v = L[r.dataset.id];
        const ok = (!s || r.dataset.stratum === s) && (!tt || r.dataset.tier === tt) && (!p || r.dataset.prov === p)
          && (!mk || r.dataset.simile === mk) && (!vh || r.dataset.veh === vh) && (!vc || r.dataset.vehcode === vc)
          && (!q || r.textContent.toLowerCase().includes(q))
          && GX.every(g => (r.dataset[g.layer] || t('veh_nolabel')) === g.val)
          && (!l || (l === 'todo' ? !v : v === l));
        r.style.display = ok ? '' : 'none'; if (ok) n++;
      }
      $('count').textContent = t('count', { n, k: rows.filter(r => L[r.dataset.id]).length }) + (GX.length ? t('count_filter', { f: gxLabel() }) : '');
    }
    ['fs', 'ft', 'fp', 'fl', 'fm', 'fv', 'fc'].forEach(i => { const el = $(i); if (el) el.onchange = apply; });
    { const fq = $('fq'); if (fq) fq.oninput = apply; }

    // ---- source-domain table (explore only) ----
    const CODE_DESC = B.code_desc || {};
    const CODE_LAYERS = new Set(['vehcode', 'vehcodeb', 'codeagree', 'vehmain', 'vehmainb', 'mainagree']);
    const USAS_LAYERS = new Set(['veh', 'vehmain', 'vehcode']);
    const BASE = { vehb: 'veh', vehmainb: 'vehmain', vehcodeb: 'vehcode', catagree: 'veh', mainagree: 'vehmain', codeagree: 'vehcode' };
    const SHOW_SUB = 8, OPEN = new Set();
    function famKey(layer) {
      if (!USAS_LAYERS.has(layer)) return layer;
      const f = ($('vfam') || { value: 'a' }).value;
      if (f === 'b') return layer + 'b';
      if (f === 'agree') return { veh: 'catagree', vehmain: 'mainagree', vehcode: 'codeagree' }[layer];
      return layer;
    }
    function famName() { const el = $('vfam'); if (!el) return ''; return ' (' + el.options[el.selectedIndex].text.replace(/ \(.*\)$/, '') + ')'; }
    function levelName(k) { return t('ln_' + (BASE[k] || k)); }
    function gxLabel() { return GX.map(g => levelName(g.layer) + ' = ' + g.val).join(' › '); }
    function show(layer, v) {
      if (!CODE_LAYERS.has(layer)) return esc(v);
      const d = CODE_DESC[v] || CODE_DESC[v.replace(/[+-]+$/, '')] || '';
      return esc(v) + (d ? ' <span style="color:var(--mut);font-weight:400"> — ' + esc(d) + (/[+-]$/.test(v) ? ' (' + (v.endsWith('+') ? t('pole_pos') : t('pole_neg')) + ')' : '') + '</span>' : '');
    }
    function levelsFor() {
      const g1 = val('vlayer'), g2 = val('vlayer2');
      const lv = g1 === 'usas' ? ['vehmain', 'vehcode'] : [g1];
      if (g2 && g2 !== g1) lv.push(g2);
      return lv.map(famKey);
    }
    function group(list, key) {
      const m = new Map();
      for (const r of list) { const v = r.dataset[key] || t('veh_nolabel'); if (!m.has(v)) m.set(v, []); m.get(v).push(r); }
      return [...m.entries()].sort((a, b) => b[1].length - a[1].length);
    }
    function pathOn(path) { return path.length === GX.length && path.every((g, i) => GX[i].layer === g.layer && GX[i].val === g.val); }
    function buildVeh() {
      const tab = $('vtab'); if (!tab) return;
      const LV = levelsFor();
      const X = parseInt(val('vtop')) || rows.length;
      const inTop = rows.filter(r => { const rk = parseInt(r.dataset.rank); return rk && rk <= X; });
      const labelled = inTop.filter(r => r.dataset[LV[0]]);
      const max = Math.max(1, ...group(labelled, LV[0]).map(([, l]) => l.length));
      let h = '<tr><th>' + LV.map(levelName).join(' › ') + (USAS_LAYERS.has(BASE[LV[0]] || LV[0]) ? famName() : '') + '</th><th>n</th><th>%</th><th></th></tr>';
      let distinct = 0;
      const render = (list, depth, path, parentN, parentLabel) => {
        const key = LV[depth];
        const items = group(list, key);
        if (depth > 0 && items.length === 1 && items[0][0] === path[path.length - 1].val)
          return depth + 1 < LV.length ? render(list, depth + 1, path, parentN, parentLabel) : '';
        if (depth === 0) distinct = items.length;
        const okey = path.map(g => g.val).join('␟');
        const lim = (depth === 0 || OPEN.has(okey)) ? items.length : SHOW_SUB;
        let out = '';
        items.slice(0, lim).forEach(([v, l]) => {
          if (depth === 0 && v === t('veh_nolabel')) return;
          const p = path.concat([{ layer: key, val: v }]);
          const share = depth === 0 ? (100 * l.length / labelled.length).toFixed(1) + '%' : (100 * l.length / parentN).toFixed(0) + t('veh_of_parent') + esc(parentLabel);
          out += '<tr class="' + (depth === 0 ? 'grp' : 'sub') + (pathOn(p) ? ' on' : '') + '" data-path="' + esc(JSON.stringify(p)) + '"><td style="padding-left:' + (depth * 22 + 8) + 'px">' + show(key, v)
            + '</td><td>' + l.length + '</td><td>' + share + '</td><td><span class="bar" style="width:' + Math.round(160 * l.length / max) + 'px;opacity:' + (depth ? .3 : .55) + '"></span></td></tr>';
          if (depth + 1 < LV.length) out += render(l, depth + 1, p, l.length, v);
        });
        if (items.length > lim) out += '<tr class="more" data-open="' + esc(okey) + '"><td colspan="4" style="padding-left:' + (depth * 22 + 8) + 'px">' + esc(t('veh_more', { n: items.length - lim })) + '</td></tr>';
        else if (depth > 0 && OPEN.has(okey) && items.length > SHOW_SUB) out += '<tr class="more" data-close="' + esc(okey) + '"><td colspan="4" style="padding-left:' + (depth * 22 + 8) + 'px">' + esc(t('veh_fewer')) + '</td></tr>';
        return out;
      };
      h += render(labelled, 0, [], labelled.length, '');
      tab.innerHTML = h;
      $('vcov').textContent = t('veh_cov', { k: labelled.length, n: inTop.length, d: distinct });
      const vcl = $('vclear');
      vcl.className = GX.length ? 'show' : ''; vcl.textContent = GX.length ? t('veh_clear_with', { f: gxLabel() }) : t('veh_clear');
      const go = () => { buildVeh(); apply(); $('bar').scrollIntoView({ behavior: 'smooth' }); };
      tab.querySelectorAll('tr[data-path]').forEach(tr => tr.onclick = () => {
        const p = JSON.parse(tr.dataset.path); GX = pathOn(p) ? [] : p;
        ['fv', 'fc'].forEach(i => { const el = $(i); if (el) el.value = ''; }); go(); });
      tab.querySelectorAll('tr.more').forEach(tr => tr.onclick = () => {
        if (tr.dataset.open !== undefined) OPEN.add(tr.dataset.open); else OPEN.delete(tr.dataset.close); buildVeh(); });
    }
    { const vcl = $('vclear'); if (vcl) vcl.onclick = () => { GX = []; buildVeh(); apply(); }; }
    { const vl = $('vlayer'), vl2 = $('vlayer2'), vt = $('vtop'), vf = $('vfam');
      if (vf) vf.onchange = () => { GX = []; OPEN.clear(); buildVeh(); apply(); };
      if (vl) { vl.onchange = vl2.onchange = () => { GX = []; OPEN.clear(); buildVeh(); apply(); }; vt.oninput = buildVeh; buildVeh(); } }
    $('fr').onclick = () => {
      ['fs', 'ft', 'fp', 'fl', 'fm', 'fv', 'fc', 'fq'].forEach(i => { const el = $(i); if (el) el.value = ''; });
      GX = []; buildVeh(); apply(); };

    // ---- export + return flow ----
    $('ex').onclick = () => {
      if (!rn.value || !rr.value) { alert(t('export_need')); return; }
      const ALL = {};
      for (const r of rows) {
        const v = L[r.dataset.id]; if (!v) continue;
        ALL[r.dataset.id] = v;
        try { for (const m of JSON.parse(r.dataset.members || '[]')) ALL[m] = v; } catch (e) { }
      }
      const blob = JSON.stringify({ corpus: B.corpus_key || B.corpus, list: B.list_id || '', lang: B.lang, stage: B.stage, stream: B.stream || '',
        rater: { name: rn.value, role: rr.value }, n_labelled: rows.filter(r => L[r.dataset.id]).length, n_candidate_ids: Object.keys(ALL).length, labels: ALL }, null, 1);
      const fname = 'labels_' + rn.value.replace(/\W+/g, '_') + '_' + rr.value + (B.list_id ? '_' + B.list_id : '') + '.json';
      const ta = $('out'); ta.style.display = 'block'; ta.value = blob;
      const rb0 = $('returnbox'); rb0.hidden = false;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([blob], { type: 'application/json' })); a.download = fname; a.click();
      const to = B.return_to || '';
      const subject = t('return_subject', { corpus: B.corpus, name: rn.value });
      const body = t('return_body', { file: fname, corpus: B.corpus, stage: t('mode_' + B.stage), name: rn.value });
      const rb = $('returnbox');
      rb.innerHTML = `<div class="status returnbox"><div class="l1"><b>${esc(t('return_heading'))}</b></div><div class="l2">${to ? t('return_text', { file: esc(fname), to: esc(to) }) : t('return_text_noaddr', { file: esc(fname) })}</div>`
        + (to ? `<div class="l3"><a class="button primary" href="mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}">${esc(t('return_mail', { to }))}</a></div>` : '')
        + `<div class="l3">${esc(t('return_copy'))}</div></div>`;
      rb.hidden = false; rb.scrollIntoView({ behavior: 'smooth' });
    };
    const lt = $('labelToggle');
    if (lt) {
      const setLabelling = on => { document.body.classList.toggle('labelling', on); lt.setAttribute('aria-pressed', String(on)); lt.textContent = on ? t('hero_label_off') : t('hero_label_on'); };
      lt.onclick = () => setLabelling(!document.body.classList.contains('labelling'));
      setLabelling(Object.keys(L).length > 0);
    }
    rows.forEach(paint); apply();
  }

  // -------------------------------------------------------------------------- boot ---
  const emb = document.getElementById('bundle');
  if (emb && emb.textContent.trim()) {
    try { render(JSON.parse(emb.textContent)); } catch (e) { console.error(e); renderLoader(browserLang(), true); }
  } else renderLoader(browserLang(), false);
  window.__review = { render, renderLoader, loadFile, decryptBundle };
})();

</script>
</body></html>
